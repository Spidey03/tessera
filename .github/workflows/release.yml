name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write       # build attestations
  attestations: write

jobs:
  build:
    name: Build + attach release artifacts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Developer ID certificate (when configured)
        env:
          CERT_P12: ${{ secrets.TESSERA_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.TESSERA_CERT_PASSWORD }}
        run: |
          [ -n "$CERT_P12" ] || { echo "No certificate configured; building unsigned."; exit 0; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build DMG (+ sign/notarize when credentials present)
        env:
          TESSERA_SIGN_IDENTITY: ${{ secrets.TESSERA_SIGN_IDENTITY }}
          TESSERA_NOTARY_KEY_ID: ${{ secrets.TESSERA_NOTARY_KEY_ID }}
          NOTARY_KEY_PEM: ${{ secrets.TESSERA_NOTARY_KEY }}
          TESSERA_NOTARY_ISSUER: ${{ secrets.TESSERA_NOTARY_ISSUER }}
        run: |
          if [ -n "$NOTARY_KEY_PEM" ]; then
            export TESSERA_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
            (umask 077; printf '%s\n' "$NOTARY_KEY_PEM" > "$TESSERA_NOTARY_KEY")
          fi
          unset NOTARY_KEY_PEM
          scripts/build_release.sh

      - name: Remove signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Build source tarball (git archive)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz -o "dist/tessera-${VERSION}.tar.gz" "v${VERSION}"

      # scripts/sign_release.sh verifies these before signing the appcast.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Upload artifacts to a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Stays a draft until scripts/sign_release.sh signs and publishes it.
          if DRAFT="$(gh release view "${TAG}" --json isDraft -q .isDraft 2>/dev/null)"; then
            [ "${DRAFT}" = true ] || { echo "::error::${TAG} is already published"; exit 1; }
          else
            gh release create "${TAG}" --draft --verify-tag --title "Tessera ${TAG#v}" --notes "Automated release build (see build_release.sh for signing status)."
          fi
          gh release upload "${TAG}" dist/* --clobber
          echo "--- uploaded ---"
          gh release view "${TAG}" --json assets -q '.assets[].name'